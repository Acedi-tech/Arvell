# Прогон на реальном Android: .maestro/tools/run.sh
# Сценарии идут по порядку: вход покупателем (если телефон гостевой) →
# залогиненные проверки → выход → гость. Сервер щадим: за прогон один запрос кода и один вход.
flows:
  - flows/*
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 00-login-wrong-code
    - 01-first-tap
    - 02-feed-product
    - 03-tabs
    - 04-seller-menu
    - 05-logout-guest
