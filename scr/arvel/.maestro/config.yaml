# Прогон на реальном Android: .maestro/tools/run.sh
# Сценарии идут по порядку и передают друг другу состояние:
#   покупатель (вход с неверным кодом, экраны, каталог) →
#   продавец QA добавляет «ТЕСТ QA кроссовки» →
#   покупатель: избранное, чат, фото в чат, «Купить» →
#   продавец отвечает и удаляет товар → выход, гость.
# Номера — BUYER_PHONE / SELLER_PHONE (см. run.sh). За прогон 4 входа.
flows:
  - flows/*
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - 00-login-wrong-code
    - 01-first-tap
    - 02-feed-product
    - 03-tabs
    - 10-buyer-screens
    - 11-catalog-search
    - 20-seller-add-product
    - 04-seller-menu
    - 30-buyer-favorite
    - 31-buyer-chat
    - 40-seller-reply
    - 41-seller-delete
    - 05-logout-guest
