# Первым в прогоне: выход и вход покупателем QA (${BUYER_PHONE}). Неверный код → русская ошибка вместо
# «invalid verification code» от бэкенда (правка 20.10), затем верный код.
appId: com.arvell.app
name: 00-login-wrong-code
tags: [server]
---
- runFlow: ../subflows/logout.yaml
- tapOn: "Профиль"
- tapOn: "Войти"
- extendedWaitUntil:
    visible: "Получить код"
    timeout: 5000
- tapOn:
    text: "\\+7.*"
- inputText: ${BUYER_PHONE}
- hideKeyboard
- tapOn: "Получить код"
# Тестовый сервер отвечает на запрос кода до 15–20 с.
- extendedWaitUntil:
    visible: "Введите код"
    timeout: 40000
- inputText: "0000"
- extendedWaitUntil:
    visible: "Неверный код. Попробуйте ещё раз."
    timeout: 20000
- assertNotVisible: ".*invalid.*"
- takeScreenshot: 00-wrong-code
# Ячейки кода — тап возвращает фокус в скрытое поле.
- tapOn:
    point: "50%,29%"
- inputText: "1234"
- extendedWaitUntil:
    visible: "Главная"
    timeout: 30000
- tapOn: "Профиль"
- extendedWaitUntil:
    visible: "Покупатель"
    timeout: 10000
