# Продавец QA добавляет товар с фото из галереи (картинки «ТЕСТ QA» —
# .maestro/tools/push-test-photos.sh). Удаляет его 41-seller-delete.
appId: com.arvell.app
name: 20-seller-add-product
tags: [server, seller]
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      PHONE: ${SELLER_PHONE}
- assertVisible: "Продавец"
- tapOn: "Объявления"
- tapOn: "Добавить товар"
- extendedWaitUntil:
    visible: "Новый товар"
    timeout: 10000
- tapOn: "Выберите категорию"
- tapOn: "Обувь › Кроссовки"
# Фото: лист «Камера / Галерея», затем системный выбор Android, «ТЕСТ QA» —
# самые свежие в галерее.
- tapOn: "Добавить фото"
- tapOn: "Галерея"
- runFlow: ../subflows/pick-photo.yaml
# Счётчик мог уехать за верх экрана, если форма прокрутилась после выбора.
- scrollUntilVisible:
    element: "Фотографии · 1/.*"
    direction: UP
    timeout: 15000
- tapOn: "Например, Air Max 90"
- inputText: "${PRODUCT}"
# Enter закрывает клавиатуру однострочного поля; hideKeyboard жмёт
# системный «Назад» и без клавиатуры (уводил с анкеты на S9, 21.10).
- pressKey: Enter
# Editorial: размер — чипы системы и значения, цвет — кружки (подпись в
# accessibilityLabel), состояние — чипы. Порядок: размер → цвет → цена.
- scrollUntilVisible:
    element: "Обувь, EU"
    centerElement: true
- tapOn: "Обувь, EU"
- tapOn: "16"
- scrollUntilVisible:
    element: "Чёрный"
    centerElement: true
- tapOn: "Чёрный"
- scrollUntilVisible:
    element: "8900"
    centerElement: true
- tapOn: "8900"
- inputText: "1234"
# Enter закрывает клавиатуру однострочного поля; hideKeyboard жмёт
# системный «Назад» и без клавиатуры (уводил с анкеты на S9, 21.10).
- pressKey: Enter
- scrollUntilVisible:
    element: "Новое"
    centerElement: true
- tapOn: "Новое"
- scrollUntilVisible:
    element: "Расскажите о состоянии.*"
    centerElement: true
- tapOn: "Расскажите о состоянии.*"
- inputText: "ТЕСТ QA — автотест, будет удалён"
- tapOn: "Опубликовать"
- extendedWaitUntil:
    visible: "Товар опубликован"
    timeout: 60000
- tapOn: "Отлично"
- extendedWaitUntil:
    visible: ".*${PRODUCT}.*"
    timeout: 20000
- takeScreenshot: 20-my-listings
