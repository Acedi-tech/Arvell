# Только под продавцом; под покупателем сценарий пропускает проверки.
appId: com.arvell.app
name: 04-seller-menu
tags: [seller]
---
- runFlow: ../subflows/launch.yaml
- tapOn: "Профиль"
- extendedWaitUntil:
    visible: "Редактировать профиль"
    timeout: 10000
- runFlow:
    when:
      visible: "Объявления"
    commands:
      - assertVisible: "Продавец"
      - assertVisible: "Продажи"
      - tapOn: "Объявления"
      - extendedWaitUntil:
          notVisible: "Редактировать профиль"
          timeout: 10000
      - takeScreenshot: 04-my-listings
      - tapOn: "Назад"
      - assertVisible: "Редактировать профиль"
