appId: com.arvell.app
name: 02-feed-product
---
- runFlow: ../subflows/launch.yaml
- tapOn: "Главная"
- extendedWaitUntil:
    visible: ".+₽"
    timeout: 20000
# Карточка ленты: content-desc «Бренд, Название, 1 990 ₽» (между разрядами
# неразрывный пробел, поэтому без [0-9 ]).
- tapOn:
    text: ".+, .+₽"
    index: 0
- extendedWaitUntil:
    visible: "Купить"
    timeout: 10000
# На экранах поменьше (Galaxy S9) «Описание» ниже фото и цены — прокрутка.
- scrollUntilVisible:
    element: "Описание"
- assertVisible: "Написать продавцу"
- takeScreenshot: 02-product
# Системный «Назад»: после прокрутки кнопка «Назад» карточки уезжает за верх
# экрана (Galaxy S9).
- back
- assertVisible: "ARVELL"
