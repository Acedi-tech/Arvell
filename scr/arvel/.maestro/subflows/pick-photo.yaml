# Выбрать первую (самую свежую — «ТЕСТ QA») картинку в системном выборе фото.
# Android 13+: системный пикер («Фото, дата…», «Готово» при множественном).
# Android 8–12: пикер Google Play («Фотография, дата…», «Добавить (N)») и
# перед первым выбором — запрос доступа к файлам.
appId: com.arvell.app
---
- runFlow:
    when:
      visible: "(РАЗРЕШИТЬ|Разрешить)"
    commands:
      - tapOn: "(РАЗРЕШИТЬ|Разрешить)"
- extendedWaitUntil:
    visible: "Фото(графия)?, дата и время съемки.*"
    timeout: 15000
- tapOn:
    text: "Фото(графия)?, дата и время съемки.*"
    index: 0
- runFlow:
    when:
      visible: "Готово"
    commands:
      - tapOn: "Готово"
- runFlow:
    when:
      visible: "Добавить \\([0-9]+\\)"
    commands:
      - tapOn: "Добавить \\([0-9]+\\)"
